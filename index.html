<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Current temperature and humidity for any city." />
    <meta name="theme-color" content="#0b1220" />
    <title>Weather Now</title>
    <link rel="preconnect" href="https://api.open-meteo.com" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">🌤️</span>
          <span class="brand-name">Weather Now</span>
        </div>

        <form class="search" id="search-form" role="search">
          <label class="visually-hidden" for="city-input">Search for a city</label>
          <input
            id="city-input"
            name="city"
            type="search"
            placeholder="Search a city…"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" class="search-button" aria-label="Search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </form>

        <div class="units" role="group" aria-label="Temperature unit">
          <button type="button" class="unit-button" data-unit="c" aria-pressed="true">°C</button>
          <button type="button" class="unit-button" data-unit="f" aria-pressed="false">°F</button>
        </div>
      </header>

      <section class="card" id="weather-card" aria-live="polite" aria-busy="true">
        <div class="card-top">
          <div class="place">
            <h1 id="location-name">Loading…</h1>
            <p id="location-detail" class="place-detail"></p>
          </div>
          <button type="button" class="locate-button" id="locate-button">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <circle cx="12" cy="12" r="3" fill="currentColor" />
              <path
                d="M12 2v3m0 14v3M2 12h3m14 0h3"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
            Use my location
          </button>
        </div>

        <div class="now">
          <div class="now-icon" id="condition-icon" aria-hidden="true">🌡️</div>
          <div class="now-main">
            <div class="temperature-row">
              <span class="temperature" id="temperature">--</span>
              <span class="temperature-unit" id="temperature-unit">°C</span>
            </div>
            <p class="condition" id="condition">Fetching the latest reading…</p>
          </div>
        </div>

        <dl class="stats">
          <div class="stat stat-humidity">
            <dt>Humidity</dt>
            <dd>
              <span id="humidity">--</span><span class="stat-unit">%</span>
              <span class="humidity-bar" aria-hidden="true"><span id="humidity-fill"></span></span>
            </dd>
          </div>
          <div class="stat">
            <dt>Feels like</dt>
            <dd><span id="apparent">--</span></dd>
          </div>
          <div class="stat">
            <dt>High / Low</dt>
            <dd><span id="high-low">--</span></dd>
          </div>
          <div class="stat">
            <dt>Wind</dt>
            <dd><span id="wind">--</span></dd>
          </div>
        </dl>

        <footer class="card-footer">
          <span id="updated">—</span>
          <span class="source">Data from Open-Meteo</span>
        </footer>

        <div class="status" id="status" hidden>
          <p id="status-message"></p>
          <button type="button" id="retry-button">Try again</button>
        </div>
      </section>

      <p class="hint">Tip: allow location access for your local weather, or search any city above.</p>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
